name: One-shot SOP concurrency DB test patch

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-db-test-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add MariaDB-backed stale writer integration test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('server/test/integration/core-workflow.integration-spec.ts')
          text = path.read_text()
          marker = "  it('menolak constraint header dan prosedur yang melanggar aturan bisnis', async () => {"
          if text.count(marker) != 1:
              raise SystemExit('integration insertion point not found')
          encoded = ''
          test = base64.b64decode(encoded).decode()
          text = text.replace(marker, test + marker, 1)
          old = '        expectedRevision: 1,\n        pelaksana: [{ pelaksanaId: state.pelaksanaId }],'
          if text.count(old) != 1:
              raise SystemExit('invalid-branch revision point not found')
          text = text.replace(
              old,
              '        expectedRevision: 2,\n        pelaksana: [{ pelaksanaId: state.pelaksanaId }],',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/test/integration/core-workflow.integration-spec.ts
          git commit -m "test(sop): prove stale writer rejection against MariaDB"
          git push origin HEAD:${GITHUB_REF_NAME}
