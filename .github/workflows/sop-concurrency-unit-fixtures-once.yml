name: One-shot SOP optimistic-lock service fixture patch

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-unit-fixtures-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Patch procedure service unit fixtures and validate focused suites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/src/modules/sop/prosedur/sop-prosedur.service.spec.ts')
          text = path.read_text()
          needle = 'service.updateProsedur'
          ranges = []
          pos = 0
          while True:
              start = text.find(needle, pos)
              if start < 0:
                  break
              open_paren = text.find('(', start + len(needle))
              p = 1
              b = 0
              s = 0
              quote = None
              escaped = False
              commas = []
              i = open_paren + 1
              while i < len(text):
                  ch = text[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in "'\"`":
                      quote = ch
                  elif ch == '(':
                      p += 1
                  elif ch == ')':
                      p -= 1
                      if p == 0:
                          ranges.append((open_paren, i, commas))
                          pos = i + 1
                          break
                  elif ch == '{':
                      b += 1
                  elif ch == '}':
                      b -= 1
                  elif ch == '[':
                      s += 1
                  elif ch == ']':
                      s -= 1
                  elif ch == ',' and p == 1 and b == 0 and s == 0:
                      commas.append(i)
                  i += 1
              else:
                  raise SystemExit('unclosed updateProsedur call')

          edits = []
          for open_paren, close_paren, commas in ranges:
              starts = [open_paren + 1] + [c + 1 for c in commas]
              ends = commas + [close_paren]
              if len(starts) < 3:
                  raise SystemExit('updateProsedur call missing DTO argument')
              a, z = starts[2], ends[2]
              raw = text[a:z]
              if 'expectedRevision' in raw:
                  continue
              leading = len(raw) - len(raw.lstrip())
              arg_start = a + leading
              if not text.startswith('{', arg_start):
                  raise SystemExit(f'DTO argument is not object literal near {arg_start}')
              stripped = raw.strip()
              if stripped == '{}':
                  edits.append((arg_start, arg_start + 2, '{ expectedRevision: 0 }'))
                  continue
              after_open = arg_start + 1
              first = after_open
              while first < z and text[first].isspace():
                  first += 1
              line_start = text.rfind('\n', after_open, first) + 1
              indent = text[line_start:first]
              edits.append((after_open, after_open, f'\n{indent}expectedRevision: 0,'))

          if len(edits) != 19:
              raise SystemExit(f'expected 19 procedure fixtures, found {len(edits)}')
          for a, z, replacement in reversed(edits):
              text = text[:a] + replacement + text[z:]
          path.write_text(text)
          PY

          cd server
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm exec prettier --write \
            src/modules/sop/prosedur/sop-prosedur.service.spec.ts \
            src/modules/sop/prosedur/sop-prosedur.repository.spec.ts \
            src/modules/sop/diagram/sop-diagram.service.spec.ts
          pnpm exec jest --runInBand \
            src/modules/sop/prosedur/sop-prosedur.service.spec.ts \
            src/modules/sop/prosedur/sop-prosedur.repository.spec.ts \
            src/modules/sop/diagram/sop-diagram.service.spec.ts
          cd ..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "test(sop): update optimistic-lock service fixtures"
          git push origin HEAD:${GITHUB_REF_NAME}
