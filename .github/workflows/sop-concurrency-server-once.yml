name: One-shot SOP concurrency server patch

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-server-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic CAS to SOP replace-all writes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_s, old, new, count=1):
              path = Path(path_s)
              text = path.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:80]!r}')
              path.write_text(text.replace(old, new, count))

          # Procedure repository: claim revision before destructive replace-all writes.
          path = 'server/src/modules/sop/prosedur/sop-prosedur.repository.ts'
          replace(
              path,
              "import { appendOrCreateLogSession } from '../collaboration/log-edit-session.helper';\n",
              "import { appendOrCreateLogSession } from '../collaboration/log-edit-session.helper';\nimport { SopEditConflictError } from '../shared/sop-edit-conflict.error';\n",
          )
          replace(
              path,
              "    changedFields: string[];\n  }): Promise<void> {\n    const { detailSopId, userId, input, changedFields } = params;\n    await this.prisma.$transaction(async (tx) => {\n      // A. Ganti pelaksana (jalur pelaksana) bila dikirim\n",
              "    changedFields: string[];\n    expectedRevision: number;\n  }): Promise<void> {\n    const { detailSopId, userId, input, changedFields, expectedRevision } = params;\n    await this.prisma.$transaction(async (tx) => {\n      // A. Atomic compare-and-swap. Jika snapshot klien stale, tidak ada domain row yang disentuh.\n      const claimed = await tx.detailSOP.updateMany({\n        where: { detailSopId, prosedurRevision: expectedRevision },\n        data: {\n          prosedurRevision: { increment: 1 },\n          terakhirDieditOlehId: userId,\n        },\n      });\n      if (claimed.count !== 1) {\n        throw new SopEditConflictError('PROSEDUR');\n      }\n\n      // B. Ganti pelaksana (jalur pelaksana) bila dikirim\n",
          )
          replace(
              path,
              "      // B. Replace langkah bila dikirim\n      if (input.langkah !== undefined) {\n        await this.replaceLangkahInTx(tx, detailSopId, input);\n      }\n\n      // C. Tandai DetailSOP sebagai baru diedit oleh user\n      await tx.detailSOP.update({\n        where: { detailSopId },\n        data: { terakhirDieditOlehId: userId },\n      });\n\n      // D. Append log sesi (merge 10 menit)\n",
              "      // C. Replace langkah bila dikirim\n      if (input.langkah !== undefined) {\n        await this.replaceLangkahInTx(tx, detailSopId, input);\n      }\n\n      // D. Append log sesi (merge 10 menit)\n",
          )

          # Procedure service: pass expected revision and expose stable 409 contract.
          path = 'server/src/modules/sop/prosedur/sop-prosedur.service.ts'
          replace(
              path,
              "import { UserOpdAccessService } from '../../core/opd/user-opd-access.service';\n",
              "import { UserOpdAccessService } from '../../core/opd/user-opd-access.service';\nimport { SopEditConflictError, sopEditConflictResponse } from '../shared/sop-edit-conflict.error';\n",
          )
          replace(
              path,
              "        input: repoInput,\n        changedFields,\n      });\n    } catch (err) {\n      if (err instanceof Prisma.PrismaClientKnownRequestError) {\n",
              "        input: repoInput,\n        changedFields,\n        expectedRevision: dto.expectedRevision,\n      });\n    } catch (err) {\n      if (err instanceof SopEditConflictError) {\n        throw new ConflictException(sopEditConflictResponse(err.section));\n      }\n      if (err instanceof Prisma.PrismaClientKnownRequestError) {\n",
          )
          replace(
              path,
              "    changedFields: string[];\n  }): Promise<void> {\n",
              "    changedFields: string[];\n    expectedRevision: number;\n  }): Promise<void> {\n",
          )

          # Diagram repository: same CAS principle before config/override replacement.
          path = 'server/src/modules/sop/diagram/sop-diagram.repository.ts'
          replace(
              path,
              "import type { DiagramPathOverridesJson } from './diagram-edge-key.util';\n",
              "import type { DiagramPathOverridesJson } from './diagram-edge-key.util';\nimport { SopEditConflictError } from '../shared/sop-edit-conflict.error';\n",
          )
          replace(
              path,
              "  pathOverrides?: DiagramPathOverridesJson | null;\n}",
              "  pathOverrides?: DiagramPathOverridesJson | null;\n  expectedRevision: number;\n}",
          )
          replace(
              path,
              "  async upsertConfig(input: UpsertDiagramConfigInput) {\n    return this.prisma.$transaction(async (tx) => {\n      const data: Prisma.KonfigurasiDiagramSOPUpdateInput = {};\n",
              "  async upsertConfig(input: UpsertDiagramConfigInput) {\n    return this.prisma.$transaction(async (tx) => {\n      const claimed = await tx.detailSOP.updateMany({\n        where: { detailSopId: input.detailSopId, diagramRevision: input.expectedRevision },\n        data: { diagramRevision: { increment: 1 } },\n      });\n      if (claimed.count !== 1) {\n        throw new SopEditConflictError('DIAGRAM');\n      }\n\n      const data: Prisma.KonfigurasiDiagramSOPUpdateInput = {};\n",
          )

          # Diagram service maps the domain conflict to HTTP 409 + stable code.
          path = 'server/src/modules/sop/diagram/sop-diagram.service.ts'
          replace(
              path,
              "  BadRequestException,\n  ForbiddenException,\n",
              "  BadRequestException,\n  ConflictException,\n  ForbiddenException,\n",
          )
          replace(
              path,
              "import { SopCatalogService } from '../catalog/sop-catalog.service';\n",
              "import { SopCatalogService } from '../catalog/sop-catalog.service';\nimport { SopEditConflictError, sopEditConflictResponse } from '../shared/sop-edit-conflict.error';\n",
          )
          replace(
              path,
              "    await this.sopDiagramRepository.upsertConfig({\n      detailSopId: resolved.detailSopId,\n      jenis: dto.jenis,\n      layoutSeed: dto.layoutSeed,\n      pathOverrides: dto.pathOverrides,\n    });\n",
              "    try {\n      await this.sopDiagramRepository.upsertConfig({\n        detailSopId: resolved.detailSopId,\n        jenis: dto.jenis,\n        layoutSeed: dto.layoutSeed,\n        pathOverrides: dto.pathOverrides,\n        expectedRevision: dto.expectedRevision,\n      });\n    } catch (error) {\n      if (error instanceof SopEditConflictError) {\n        throw new ConflictException(sopEditConflictResponse(error.section));\n      }\n      throw error;\n    }\n",
          )

          # Workbench exposes current revisions to clients.
          path = 'server/src/modules/sop/catalog/dto/penyusun-workbench-detail.dto.ts'
          replace(
              path,
              "  @ApiProperty()\n  readonly versi!: number;\n\n  @ApiPropertyOptional({\n",
              "  @ApiProperty()\n  readonly versi!: number;\n\n  @ApiProperty({ minimum: 0, description: 'Revision optimistic-lock prosedur replace-all.' })\n  readonly prosedurRevision!: number;\n\n  @ApiProperty({ minimum: 0, description: 'Revision optimistic-lock konfigurasi diagram.' })\n  readonly diagramRevision!: number;\n\n  @ApiPropertyOptional({\n",
          )
          path = 'server/src/modules/sop/catalog/sop-catalog.mapper.ts'
          replace(
              path,
              "    statusLabel: statusDisplay.label,\n    versi: row.versi,\n    revisiDariDetailSopId: row.revisiDariDetailSopId,\n",
              "    statusLabel: statusDisplay.label,\n    versi: row.versi,\n    prosedurRevision: row.prosedurRevision,\n    diagramRevision: row.diagramRevision,\n    revisiDariDetailSopId: row.revisiDariDetailSopId,\n",
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src
          git commit -m "feat(sop): enforce atomic autosave revisions"
          git push origin HEAD:${GITHUB_REF_NAME}
