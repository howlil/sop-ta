name: One-shot SOP revision schema patch

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-revision-schema-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add optimistic concurrency counters to Prisma schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/prisma/schema.prisma')
          text = path.read_text()
          needle = '  revisiDariDetailSopId          String?                          @db.Char(36)\n  createdAt                      DateTime                         @default(now())'
          replacement = '  revisiDariDetailSopId          String?                          @db.Char(36)\n  prosedurRevision               Int                              @default(0)\n  diagramRevision                Int                              @default(0)\n  createdAt                      DateTime                         @default(now())'
          if needle not in text:
              raise SystemExit('DetailSOP insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/prisma/schema.prisma
          git commit -m "feat(sop): add autosave revision counters"
          git push origin HEAD:${GITHUB_REF_NAME}
