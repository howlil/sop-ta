name: One-shot SOP concurrency caller patch

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-callers-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update direct SOP autosave callers with revisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_s, old, new, count=1):
              path = Path(path_s)
              text = path.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old[:100]!r}')
              path.write_text(text.replace(old, new, count))

          replace(
            'client/e2e/support/e2e-flow.ts',
            "  await apiPatch<Workbench>(context, `/sop/langkah/${detailSopId}`, {\n    pelaksana:",
            "  await apiPatch<Workbench>(context, `/sop/langkah/${detailSopId}`, {\n    expectedRevision: 0,\n    pelaksana:",
          )
          replace(
            'client/e2e/sop-authoring.spec.ts',
            "      await apiPatch(penyusun, `/sop/langkah/${draft.detailSopId}`, {\n        pelaksana:",
            "      await apiPatch(penyusun, `/sop/langkah/${draft.detailSopId}`, {\n        expectedRevision: 0,\n        pelaksana:",
          )

          # Core workflow: first replace-all succeeds (0 -> 1); later invalid payload is tested at revision 1.
          path = 'server/test/integration/core-workflow.integration-spec.ts'
          replace(
            path,
            "      .patch(`${API}/sop/langkah/${state.detailSopId}`)\n      .send({\n        pelaksana:",
            "      .patch(`${API}/sop/langkah/${state.detailSopId}`)\n      .send({\n        expectedRevision: 0,\n        pelaksana:",
            2,
          )
          # The previous replacement gave both calls 0; correct the second invalid-branch call to current revision 1.
          text = Path(path).read_text()
          needle = "const invalidBranch = await penyusunAgent\n      .patch(`${API}/sop/langkah/${state.detailSopId}`)\n      .send({\n        expectedRevision: 0,"
          if text.count(needle) != 1:
              raise SystemExit('core-workflow invalidBranch insertion point not found')
          Path(path).write_text(text.replace(needle, needle.replace('expectedRevision: 0', 'expectedRevision: 1'), 1))
          replace(
            path,
            ".patch(`${API}/sop/diagram/${state.detailSopId}`)\n      .send({ jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })",
            ".patch(`${API}/sop/diagram/${state.detailSopId}`)\n      .send({ expectedRevision: 0, jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })",
          )

          # Versioning helper/new revision each starts its own editor revision counters at zero.
          path = 'server/test/integration/sop-versioning.integration-spec.ts'
          replace(
            path,
            ".patch(`${API}/sop/langkah/${detailSopId}`)\n    .send({\n      pelaksana:",
            ".patch(`${API}/sop/langkah/${detailSopId}`)\n    .send({\n      expectedRevision: 0,\n      pelaksana:",
          )
          replace(
            path,
            ".patch(`${API}/sop/langkah/${draftSopId}`)\n        .send({\n          pelaksana:",
            ".patch(`${API}/sop/langkah/${draftSopId}`)\n        .send({\n          expectedRevision: 0,\n          pelaksana:",
          )
          replace(
            path,
            ".patch(`${API}/sop/diagram/${detailSopId}`)\n    .send({ jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })",
            ".patch(`${API}/sop/diagram/${detailSopId}`)\n    .send({ expectedRevision: 0, jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })",
          )
          replace(
            path,
            ".patch(`${API}/sop/diagram/${draftSopId}`)\n        .send({ jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })",
            ".patch(`${API}/sop/diagram/${draftSopId}`)\n        .send({ expectedRevision: 0, jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })",
          )

          for path in [
            'server/test/integration/evaluasi-edge-cases.integration-spec.ts',
            'server/test/integration/tte-pdf-qr-verifikasi.integration-spec.ts',
          ]:
              text = Path(path).read_text()
              old = ".patch(`${API}/sop/langkah/${detailSopId}`)\n    .send({\n      pelaksana:"
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: procedure caller not found exactly once')
              text = text.replace(old, ".patch(`${API}/sop/langkah/${detailSopId}`)\n    .send({\n      expectedRevision: 0,\n      pelaksana:", 1)
              old_d = ".patch(`${API}/sop/diagram/${detailSopId}`)\n    .send({ jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })"
              if text.count(old_d) != 1:
                  raise SystemExit(f'{path}: diagram caller not found exactly once')
              text = text.replace(old_d, ".patch(`${API}/sop/diagram/${detailSopId}`)\n    .send({ expectedRevision: 0, jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })", 1)
              Path(path).write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/e2e server/test/integration
          git commit -m "test(sop): send revisions from direct autosave callers"
          git push origin HEAD:${GITHUB_REF_NAME}
