name: One-shot SOP concurrency prettier fix

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Format touched server tests
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/modules/sop/prosedur/sop-prosedur.repository.concurrency.spec.ts \
            test/integration/core-workflow.integration-spec.ts \
            test/integration/evaluasi-edge-cases.integration-spec.ts \
            test/integration/sop-versioning.integration-spec.ts \
            test/integration/tte-pdf-qr-verifikasi.integration-spec.ts
      - name: Commit formatting
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "test(sop): format concurrency fixtures"
          git push origin HEAD:${GITHUB_REF_NAME}
