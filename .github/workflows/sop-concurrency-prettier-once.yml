name: One-shot SOP concurrency prettier fix

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize touched diagram request formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              'server/test/integration/core-workflow.integration-spec.ts',
              'server/test/integration/evaluasi-edge-cases.integration-spec.ts',
              'server/test/integration/sop-versioning.integration-spec.ts',
              'server/test/integration/tte-pdf-qr-verifikasi.integration-spec.ts',
          ]
          pattern = re.compile(
              r"(?m)^(?P<i>\s*)\.send\(\{\n"
              r"\s*expectedRevision: 0,\n"
              r"\s*jenis: 'FLOWCHART',\n"
              r"\s*layoutSeed: 1,\n"
              r"\s*pathOverrides: \{ edges: \{\}, labels: \{\} \},\n"
              r"\s*\}\)"
          )
          changed = 0
          for file in files:
              path = Path(file)
              text = path.read_text()
              def repl(match):
                  global changed
                  changed += 1
                  i = match.group('i')
                  j = i + '  '
                  return (
                      f"{i}.send({{\n"
                      f"{j}expectedRevision: 0,\n"
                      f"{j}jenis: 'FLOWCHART',\n"
                      f"{j}layoutSeed: 1,\n"
                      f"{j}pathOverrides: {{ edges: {{}}, labels: {{}} }},\n"
                      f"{i}}})"
                  )
              next_text = pattern.sub(repl, text)
              path.write_text(next_text)
          if changed != 5:
              raise SystemExit(f'expected 5 diagram request blocks, normalized {changed}')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "test(sop): format concurrency fixtures"
          git push origin HEAD:${GITHUB_REF_NAME}
