name: One-shot SOP concurrency final lint fix

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-final-lint-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Fix final test lint issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/src/modules/sop/prosedur/sop-prosedur.repository.spec.ts')
          text = path.read_text()
          old = "  tx: any;\n  calls: CallLog[];\n"
          new = "  tx: object;\n  calls: CallLog[];\n"
          if text.count(old) != 1:
              raise SystemExit('tx return type target missing')
          text = text.replace(old, new, 1)
          old = "    jest.fn(async (args: unknown) => {"
          new = "    jest.fn((args: unknown) => {"
          if text.count(old) != 1:
              raise SystemExit('async mock target missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cd server
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/modules/sop/prosedur/sop-prosedur.repository.spec.ts \
            src/modules/sop/prosedur/sop-prosedur.service.spec.ts
          sed -i 's/\r$//' \
            src/modules/sop/prosedur/sop-prosedur.repository.spec.ts \
            src/modules/sop/prosedur/sop-prosedur.service.spec.ts
          cd ..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "test(sop): clean optimistic-lock fixture lint"
          git push origin HEAD:${GITHUB_REF_NAME}
