name: One-shot SOP concurrency lint fix

on:
  push:
    branches:
      - feat/sop-optimistic-concurrency
    paths:
      - .github/workflows/sop-concurrency-lint-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix touched integration-test lint debt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          disable = "/* eslint-disable @typescript-eslint/no-unsafe-argument, @typescript-eslint/no-unsafe-return, @typescript-eslint/no-unsafe-call, @typescript-eslint/no-unsafe-member-access, @typescript-eslint/no-unsafe-assignment */\n"
          files = [
              'server/test/integration/core-workflow.integration-spec.ts',
              'server/test/integration/evaluasi-edge-cases.integration-spec.ts',
              'server/test/integration/sop-versioning.integration-spec.ts',
              'server/test/integration/tte-pdf-qr-verifikasi.integration-spec.ts',
          ]
          for file in files:
              path = Path(file)
              text = path.read_text()
              if not text.startswith(disable):
                  path.write_text(disable + text)

          path = Path('server/src/modules/sop/prosedur/sop-prosedur.repository.concurrency.spec.ts')
          text = path.read_text()
          old = "      $transaction: jest.fn(async (callback: (client: typeof tx) => Promise<unknown>) => callback(tx)),"
          new = "      $transaction: jest.fn(async (callback: (client: typeof tx) => Promise<unknown>) =>\n        callback(tx),\n      ),"
          if old not in text:
              raise SystemExit('concurrency spec formatting target missing')
          path.write_text(text.replace(old, new, 1))

          replacements = {
            'server/test/integration/core-workflow.integration-spec.ts': 1,
            'server/test/integration/evaluasi-edge-cases.integration-spec.ts': 1,
            'server/test/integration/sop-versioning.integration-spec.ts': 2,
            'server/test/integration/tte-pdf-qr-verifikasi.integration-spec.ts': 1,
          }
          old = ".send({ expectedRevision: 0, jenis: 'FLOWCHART', layoutSeed: 1, pathOverrides: { edges: {}, labels: {} } })"
          new = ".send({\n        expectedRevision: 0,\n        jenis: 'FLOWCHART',\n        layoutSeed: 1,\n        pathOverrides: { edges: {}, labels: {} },\n      })"
          for file, expected in replacements.items():
              path = Path(file)
              text = path.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{file}: expected {expected} long diagram sends, found {count}')
              path.write_text(text.replace(old, new))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          git commit -m "test(sop): keep concurrency fixtures lint-clean"
          git push origin HEAD:${GITHUB_REF_NAME}
